# Dependabot configuration.
#
# Why this exists: the workflows consume third-party actions by floating tag
# (actions/checkout@v5, softprops/action-gh-release@v3, actions/ai-inference@v2,
# actions/labeler@v6). The release workflow runs with `contents: write` and
# pushes to SourceForge, so a compromised or retagged action is a direct path
# to a tampered release. Dependabot keeps these current and visible.
#
# Note: this supersedes the earlier plan to pin every action to a commit SHA.
# SHA pinning is still the stronger end state and should be done with SHAs
# verified against the upstream tags (see reports/v2026.09.18/) rather than
# transcribed by hand, because an incorrect SHA fails the release build.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # Rust profile auditor (tools/neos-profile-audit) — the canonical profile
  # validator that CI executes.
  - package-ecosystem: "cargo"
    directory: "/tools/neos-profile-audit"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  # Go mirror-ranking CLI (tools/neosctl).
  - package-ecosystem: "gomod"
    directory: "/tools/neosctl"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
